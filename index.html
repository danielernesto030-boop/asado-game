<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Asado Tycoon</title>
<style>
  @font-face { font-family: 'Lilita One'; src: url(fonts/LilitaOne.woff2) format('woff2'), url(https://fonts.gstatic.com/s/lilitaone/v17/i7dPIFZ9Zz-WBtRtedDbYEF8RQ.woff2) format('woff2'); font-display: swap; }
  :root { color-scheme: dark; --hud-font: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
    --outline: 0 2px 0 #2a1408, 1px 1px 0 #2a1408, -1px -1px 0 #2a1408, 1px -1px 0 #2a1408, -1px 1px 0 #2a1408, 0 3px 6px #0009; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; color: #fff; }
  [hidden] { display: none !important; }
  .hud { position: fixed; pointer-events: none; font-family: var(--hud-font); letter-spacing: .02em; text-shadow: var(--outline); }
  .ico { width: 1.35em; height: 1.35em; vertical-align: middle; filter: drop-shadow(0 2px 1px #0007); }
  /* wooden signs: the Higgsfield panel as a stretchable 9-slice */
  .wood { border: 18px solid transparent; border-image: url(ui/sign.webp) 52 60 fill / 18px 22px stretch; color: #fff6e0; }
  #hud { top: 10px; right: 14px; padding: 2px 6px; display: flex; align-items: center; gap: 14px; font-size: 22px; font-variant-numeric: tabular-nums; }
  #hud .money { color: #7dff8a; }
  #hud .st { font-size: 14px; padding: 3px 9px 2px; border-radius: 999px; border: 2px solid #2a1408; text-shadow: 0 1px 0 #0008; }
  #hud .open { background: #2e9d3e; }
  #hud .closed { background: #c9312a; }
  #event { top: 92px; right: 60px; padding: 0 10px; font-size: 21px; color: #ffd76a; transform-origin: 50% -40px; animation: sway 2.6s ease-in-out infinite; }
  #event::before, #event::after { content: ''; position: absolute; top: -46px; width: 3px; height: 34px; background: #3b2412; }
  #event::before { left: 14%; } #event::after { right: 14%; }
  @keyframes sway { 50% { transform: rotate(2.5deg); } }
  #hint { top: 14px; left: 16px; font-size: 17px; color: #fff3d6; max-width: min(56vw, 640px); }
  #prompt { bottom: 52px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; font-size: 20px; white-space: nowrap; }
  #prompt .pill { padding: 6px 16px 5px; border-radius: 999px; background: #e0781f; border: 3px solid #2a1408; box-shadow: 0 3px 0 #2a1408; }
  #prompt .pill.info { background: #6b4528; }
  #prompt .ico { width: 44px; height: 44px; }
  #card { top: 50%; left: calc(50% + 40px); transform: translateY(-50%); min-width: 170px; padding: 0 6px; font-size: 18px; }
  #card .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #ffd76a; font-size: 20px; }
  #card .row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  #card .row .ico { width: 30px; height: 30px; }
  #card .ok { color: #7dff8a; margin-left: auto; }
  #card .tot { margin-top: 4px; text-align: right; color: #7dff8a; }
  #msg { bottom: 112px; left: 50%; transform: translateX(-50%); font-size: 24px; color: #9f6; white-space: nowrap; }
  #cross { top: 50%; left: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000b; cursor: pointer; text-align: center; }
  #start h1 { font-size: 56px; margin: 0 0 10px; color: #ffb347; font-family: var(--hud-font); font-weight: 400; text-shadow: var(--outline); }
  #start p { font-size: 18px; margin: 4px; }
  /* ASADO OS terminal + end-of-day summary */
  .ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000c; font: 15px ui-monospace, Menlo, Consolas, monospace; }
  .win { width: min(920px, 94vw); max-height: 88vh; overflow: auto; background: #10231a; color: #cfe8d5; border: 2px solid #3f7a55; box-shadow: 0 0 40px #000a; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #3f7a55; color: #06120b; padding: 6px 12px; font-weight: 700; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 12px 0; }
  .pane { padding: 12px; }
  .ui button { font: inherit; cursor: pointer; background: #1c3b2a; color: #cfe8d5; border: 1px solid #3f7a55; padding: 5px 12px; }
  .ui button:hover:not(:disabled) { background: #2b5a40; }
  .ui button:focus-visible { outline: 2px solid #ffd76a; }
  .ui button.on { background: #cfe8d5; color: #10231a; }
  .ui button:disabled { opacity: .4; cursor: default; }
  .bar button { background: #10231a; }
  .ui table { width: 100%; border-collapse: collapse; }
  .ui td, .ui th { padding: 6px 8px; border-bottom: 1px solid #25483a; text-align: left; vertical-align: middle; }
  .ui th { color: #8fc0a0; font-weight: 400; font-size: 13px; }
  .num { text-align: right !important; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cat { color: #ffd76a; padding-top: 16px !important; letter-spacing: .08em; }
  .muted { color: #86a893; font-size: 13px; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 12px; }
  .big { font-size: 20px; }
  .pos { color: #8fe39f; }
  .neg { color: #ff8a80; }
  .ui .ico { width: 26px; height: 26px; vertical-align: middle; margin-right: 6px; }
  /* end-of-day summary: the same wooden sign style as the HUD */
  #summary .win { background: none; border: 26px solid transparent; border-image: url(ui/sign.webp) 52 60 fill / 26px 32px stretch; box-shadow: none;
    font-family: var(--hud-font); font-size: 18px; color: #fff6e0; text-shadow: var(--outline); letter-spacing: .02em; }
  #summary .bar { background: none; color: #ffd76a; font-size: 26px; padding: 0 8px; }
  #summary .pane { padding: 4px 10px; }
  #summary td, #summary th { border-bottom-color: #ffffff22; }
  #summary .muted { color: #f3dfb5; font-size: 15px; }
  #summary button { font-family: var(--hud-font); font-size: 18px; background: #2e9d3e; color: #fff; border: 3px solid #2a1408; border-radius: 999px; padding: 6px 18px; text-shadow: var(--outline); }
  #summary .neg { color: #ff8a80; } #summary .pos { color: #7dff8a; }
</style>
</head>
<body>
<div id="hud" class="hud"></div>
<div id="hint" class="hud"></div>
<div id="msg" class="hud"></div>
<div id="prompt" class="hud"></div>
<div id="cross" class="hud"></div>
<div id="event" class="hud wood" hidden></div>
<div id="card" class="hud wood" hidden></div>
<div id="start">
  <h1>ASADO TYCOON</h1>
  <p>WASD move · Mouse look · E interact · Esc pause</p>
  <p>Carry in supplies, cut the meat, grill, serve, then check the books and plan tomorrow.</p>
  <p><b>Click to play</b></p>
</div>
<div id="os" class="ui" hidden></div>
<div id="summary" class="ui" hidden></div>
<script type="module" src="/main.js"></script>
</body>
</html>
